{% extends 'index.html' %}
{% block content %}
<div class="container-fluid">
  <div class="card">
    <div class="card-body">
      <h5 class="card-title fw-semibold mb-4">Nuevo Usuario</h5>

      <div class="card">
        <div class="card-body">
          <form action="{% url 'save_user_new' %}" method="post">
            {% csrf_token %}

            <!-- Checkbox Ecuatoriano -->
            <div class="flex items-center mb-4">
              <input
                class="mr-2"
                type="checkbox"
                name="ecuatoriano"
                id="ecuatoriano"
                onchange="validarEcuatoriano()"
                {% if usuario.ecuatoriano %}checked{% endif %}
              />
              <label class="text-gray-700 dark:text-gray-400" for="ecuatoriano">
                Ecuatoriano
              </label>
            </div>

            <!-- DNI / Cédula -->
            <div class="mb-3">
              <label class="form-label">Cédula</label>
              <input
                type="text"
                class="form-control"
                id="dni_cedula"
                name="dni_cedula"
                maxlength="13"
                inputmode="numeric"
                pattern="[0-9]*$"
              >
            </div>

            <!-- Nombres y apellidos -->
            <div class="mb-3">
              <label class="form-label">Nombres</label>
              <input type="text" class="form-control" id="nombres" name="nombres" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Apellido Paterno</label>
              <input type="text" class="form-control" id="apellido_paterno" name="apellido_paterno" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Apellido Materno</label>
              <input type="text" class="form-control" id="apellido_materno" name="apellido_materno" required>
            </div>

            <!-- Teléfono -->
            <div class="mb-3">
              <label class="form-label">Teléfono</label>
              <input
                type="text"
                class="form-control"
                id="telefono"
                name="telefono"
                maxlength="10"
              >
            </div>

            <!-- Sector -->
            <div class="mb-3">
              <label class="form-label">Sector</label>
              <select class="form-select" name="sector" id="sector">
                {% for sector in sectores %}
                  <option value="{{ sector.id }}">{{ sector.nombre }}</option>
                {% endfor %}
              </select>
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  // Validador de cédula ecuatoriana
  function validarCedulaEcuatoriana(input) {
    let cedula = input.value.trim();

    // Debe tener 10 dígitos numéricos
    if (cedula.length !== 10 || isNaN(cedula)) {
      input.setCustomValidity("La cédula debe tener 10 dígitos numéricos.");
      return;
    }

    let provincia = parseInt(cedula.substring(0, 2), 10);
    let tercerDigito = parseInt(cedula.substring(2, 3), 10);
    let coeficientes = [2, 1, 2, 1, 2, 1, 2, 1, 2];

    // Provincia 01–24 y tercer dígito < 6 (personas naturales)
    if (provincia < 1 || provincia > 24 || tercerDigito >= 6) {
      input.setCustomValidity("La cédula no es válida.");
      return;
    }

    let suma = 0;
    for (let i = 0; i < 9; i++) {
      let valor = parseInt(cedula.charAt(i), 10) * coeficientes[i];
      suma += valor > 9 ? valor - 9 : valor;
    }

    let digitoVerificador = parseInt(cedula.charAt(9), 10);
    let resultado = suma % 10 === 0 ? 0 : 10 - (suma % 10);

    if (resultado !== digitoVerificador) {
      input.setCustomValidity("La cédula no es válida.");
    } else {
      input.setCustomValidity("");
    }
  }

  // Activar / desactivar validación según el checkbox
  function validarEcuatoriano() {
    let cedula = document.getElementById("dni_cedula");
    let esEcuatoriano = document.getElementById("ecuatoriano").checked;

    if (esEcuatoriano) {
      cedula.setAttribute("pattern", "^[0-9]{10}$");
      cedula.oninput = function () {
        validarCedulaEcuatoriana(this);
      };
      // Validar inmediatamente por si ya hay valor
      validarCedulaEcuatoriana(cedula);
    } else {
      cedula.removeAttribute("pattern");
      cedula.oninput = null;
      cedula.setCustomValidity("");
    }
  }

  // Opcional: inicializar estado al cargar si vienes con usuario.ecuatoriano
  document.addEventListener("DOMContentLoaded", function () {
    const dniInput = document.getElementById("dni_cedula");
      dniInput.addEventListener("input", function () {
        this.value = this.value.replace(/\D/g, ""); // elimina cualquier carácter no numérico
      });
    validarEcuatoriano();
  });

</script>
{% endblock %}
